<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quanto custa? Quanto sobra? – 7º ano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Figtree:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#0F4C4A; --paper:#FFFDF4; --ink:#1F2937; --muted:#5B6575; --line:#C9C2AE;
  --ok:#157347; --okbg:#DDF3E4; --bad:#B42318; --badbg:#FBE4E1;
  --s1:#C2362B; --s2:#3B3FB5; --hl:#FFE28A; --hlink:#1B1B1B; --btn:#1F2937; --btnink:#FFFDF4;
  --mono:"Courier Prime","Courier New",monospace; --sans:"Figtree","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A2928; --paper:#1B2A2A; --ink:#EEF2EE; --muted:#A9B8B6; --line:#3A4D4B;
    --ok:#6EDC9A; --okbg:#173A28; --bad:#FF9A8F; --badbg:#432220;
    --s1:#FF8A7E; --s2:#A5A8FF; --hl:#5A4A10; --hlink:#F6EBC0; --btn:#EEF2EE; --btnink:#1B2A2A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A2928; --paper:#1B2A2A; --ink:#EEF2EE; --muted:#A9B8B6; --line:#3A4D4B;
  --ok:#6EDC9A; --okbg:#173A28; --bad:#FF9A8F; --badbg:#432220;
  --s1:#FF8A7E; --s2:#A5A8FF; --hl:#5A4A10; --hlink:#F6EBC0; --btn:#EEF2EE; --btnink:#1B2A2A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.05rem;line-height:1.5;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.06) 1.5px,transparent 1.5px);background-size:22px 22px}
:focus-visible{outline:3px solid var(--s2);outline-offset:3px}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;padding:2px 2px 8px}
.prog{display:flex;gap:5px;flex:1}
.prog i{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.28);transition:background .2s}
.prog i.on{background:#FFE28A}
.recbtn{font:inherit;font-weight:800;font-size:.9rem;color:#14213D;background:#FFE28A;border:0;border-radius:999px;padding:7px 13px;min-height:38px;cursor:pointer;white-space:nowrap}
main{min-height:0;display:flex}
.card{background:var(--paper);border-radius:14px;padding:20px 18px 22px;width:100%;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.35);
  border-bottom:6px dashed var(--line)}
h1{font-size:2rem;line-height:1.08;margin:.4rem 0 .5rem;font-weight:800}
h2{font-size:1.4rem;line-height:1.15;margin:0 0 .5rem;font-weight:800}
h3{font-size:1.1rem;margin:.8rem 0 .3rem;font-weight:800}
p{margin:.4rem 0}
.store{font-family:var(--mono);font-weight:700;letter-spacing:.5px;text-align:center}
.center{text-align:center}
.muted{color:var(--muted)}
.big{width:60px;height:60px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:1.8rem;margin-bottom:10px}
.calc{font-family:var(--mono);background:var(--hl);color:var(--hlink);padding:12px 14px;border-radius:10px;margin:.7rem 0;line-height:1.7;font-size:1.05rem;overflow-x:auto}
.tip{border-left:5px solid var(--s2);background:var(--okbg);padding:9px 12px;border-radius:0 8px 8px 0;margin:.7rem 0}
.qno{font-family:var(--mono);font-weight:700;color:var(--muted);font-size:.95rem}
.stmt{font-weight:700;font-size:1.1rem;margin:.2rem 0 .8rem}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px;cursor:pointer;width:100%}
.opt .l{font-family:var(--mono);font-weight:700}
.opt:hover:not(:disabled){border-color:var(--s2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.reveal{display:none;margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.reveal.on{display:block}
.steps{counter-reset:s;list-style:none;padding:0;margin:.5rem 0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 42px;border-bottom:1px dotted var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:30px;height:30px;border-radius:50%;background:var(--s2);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--mono)}
:root[data-theme="dark"] .steps li::before{color:#101020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .steps li::before{color:#101020}}
.res{font-family:var(--mono);font-weight:700;font-size:1.15rem;border:3px double var(--ok);color:var(--ok);padding:8px 12px;border-radius:8px;display:inline-block;margin:.5rem 0}
.mono-s{font-family:var(--mono);font-weight:700}
.why{padding-left:1.1rem;margin:.3rem 0}.why li{margin:.35rem 0}
.stamp{border:3px solid;border-radius:12px;padding:12px 14px;margin:12px 0}
.stamp.s1{color:var(--s1);border-color:var(--s1)}
.stamp.s2{color:var(--s2);border-color:var(--s2)}
.stamp>b{display:block;font-family:var(--mono);font-size:1.1rem;letter-spacing:1px}
.stamp span{color:var(--ink);font-weight:500}
.total{display:flex;justify-content:space-between;font-family:var(--mono);font-weight:700;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);padding:10px 0;margin:12px 0}
nav{display:flex;gap:10px;padding-top:10px}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 18px;min-height:50px;background:var(--btn);color:var(--btnink);cursor:pointer;flex:1}
.btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5);flex:0 0 38%}
.btn:disabled{opacity:.4;cursor:default}
/* popup */
.ov{position:fixed;inset:0;background:rgba(5,20,20,.78);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:50}
.ov.on{display:flex}
.dlg{background:var(--paper);border-radius:16px;max-width:460px;width:100%;max-height:100%;overflow-y:auto;padding:20px 18px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.dlg h2{text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-height:620px){h1{font-size:1.6rem}.card{padding:14px}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <button class="recbtn" id="recbtn" type="button">Recados</button>
  </header>
  <main><section class="card" id="card" aria-live="polite"></section></main>
  <nav>
    <button class="btn ghost" id="back" type="button">Voltar</button>
    <button class="btn" id="next" type="button">Próximo</button>
  </nav>
</div>

<!-- POP-UP DE RECADOS -->
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovt">
  <div class="dlg">
    <h2 id="ovt">Recados importantes</h2>
    <div class="stamp s2"><b>MATIFIC</b><span>O Matific equivale à <b>nota do bimestre</b>. Faça as atividades com atenção.</span></div>
    <div class="stamp s1"><b>TAREFA</b><span>A tarefa tem que estar <b>tudo em dia</b>. A resposta lançada na plataforma é a que vale nota.</span></div>
    <button class="btn" id="ok" type="button" style="width:100%;margin-top:6px">Entendi</button>
  </div>
</div>

<script>
(function(){
  var L=["A","B","C","D"];
  var Q=[
   {t:"Em um quiosque na praia, uma pessoa comprou 3 garrafas de água, cada uma custando R$ 2,50. Qual foi o valor total pago?",
    o:["R$ 5,00.","R$ 6,50.","R$ 7,50.","R$ 8,00."],c:2,
    steps:["Leia o que a questão quer: o <b>valor total</b> de 3 garrafas.",
           "As garrafas custam o mesmo preço, então <b>multiplique</b>: 3 × 2,50.",
           "Separe o preço: 2,50 = 2 + 0,50. Então 3 × 2 = 6,00 e 3 × 0,50 = 1,50.",
           "Some as partes: 6,00 + 1,50 = 7,50."],
    res:"Resposta: C) R$ 7,50",
    prova:"Prova: 2,50 + 2,50 + 2,50 = 7,50.",
    why:["<b>A) R$ 5,00:</b> é o preço de apenas 2 garrafas (2 × 2,50). Faltou 1 garrafa.",
         "<b>B) R$ 6,50:</b> não é o resultado de nenhum número inteiro de garrafas. 2 garrafas custam 5,00 e 3 custam 7,50.",
         "<b>D) R$ 8,00:</b> também não bate. 3 garrafas a R$ 2,50 dão 7,50, e não 8,00."]},
   {t:"Uma padaria vende kits de sobremesa para entrega. Cada kit contém 4 doces, e cada doce custa R$ 3,75. Se forem preparados 9 kits, qual será o custo total apenas dos doces?",
    o:["R$ 108,00.","R$ 126,00.","R$ 135,00.","R$ 144,00."],c:2,
    steps:["Primeiro, quantos doces são no total? 9 kits × 4 doces = <b>36 doces</b>.",
           "Agora o preço: 36 doces × 3,75. Separe 3,75 = 3 + 0,75.",
           "36 × 3 = 108,00. E 36 × 0,75 = 27,00 (0,75 é três quartos: 36 ÷ 4 = 9 e 9 × 3 = 27).",
           "Some: 108,00 + 27,00 = 135,00."],
    res:"Resposta: C) R$ 135,00",
    prova:"Outro caminho: 1 kit custa 4 × 3,75 = 15,00. Então 9 kits custam 9 × 15,00 = 135,00. Deu igual!",
    why:["<b>A) R$ 108,00:</b> seria se cada doce custasse R$ 3,00 (36 × 3).",
         "<b>B) R$ 126,00:</b> seria se cada doce custasse R$ 3,50 (36 × 3,50).",
         "<b>D) R$ 144,00:</b> seria se cada doce custasse R$ 4,00 (36 × 4)."]},
   {t:"Uma pessoa foi a uma feira de artesanato e comprou os seguintes produtos: 1 chaveiro por R$ 8,50; 1 carteira simples por R$ 12,40; 1 pulseira por R$ 9,10. No momento do pagamento, entregou R$ 40,00. Qual foi o valor do troco recebido?",
    o:["R$ 9,60.","R$ 10,00.","R$ 18,50.","R$ 19,10."],c:1,
    steps:["Primeiro ache o <b>total</b> da compra. Compras diferentes: some.",
           "8,50 + 12,40 = 20,90.",
           "20,90 + 9,10 = 30,00.",
           "Agora o troco: pagou 40,00 e o total foi 30,00. Então 40,00 − 30,00 = 10,00."],
    res:"Resposta: B) R$ 10,00",
    prova:"Prova: total + troco = 30,00 + 10,00 = 40,00, que foi o que a pessoa entregou.",
    why:["<b>A) R$ 9,60:</b> viria de um total de 30,40, mas a soma certa é 30,00.",
         "<b>C) R$ 18,50:</b> é o troco se você esquecer o chaveiro (total 21,50). Todos os 3 produtos entram na conta.",
         "<b>D) R$ 19,10:</b> é o troco se você esquecer a pulseira (total 20,90). Todos os 3 produtos entram na conta."]},
   {t:"Em uma banca de frutas, uma pessoa comprou 1 maçã por R$ 2,00 e 1 banana por R$ 1,50. Ela pagou com R$ 5,00. Quanto recebeu de troco?",
    o:["R$ 1,00.","R$ 1,50.","R$ 2,00.","R$ 3,50."],c:1,
    steps:["Primeiro o <b>total</b>: 2,00 + 1,50 = 3,50.",
           "Agora o troco: 5,00 − 3,50 = 1,50.",
           "Dica para subtrair: de 3,50 até 5,00 faltam 1,50."],
    res:"Resposta: B) R$ 1,50",
    prova:"Prova: total + troco = 3,50 + 1,50 = 5,00.",
    why:["<b>A) R$ 1,00:</b> viria de um total de 4,00, mas 2,00 + 1,50 dá 3,50.",
         "<b>C) R$ 2,00:</b> viria de um total de 3,00, mas o total certo é 3,50.",
         "<b>D) R$ 3,50:</b> esse é o <b>total gasto</b>, e não o troco. O troco é o que sobra dos 5,00."]}
  ];
  var answered=[null,null,null,null];

  var S=[];
  S.push({html:function(){return '<div class="store">MERCADINHO DA MATEMÁTICA</div><h1 class="center">Quanto custa? Quanto sobra?</h1><p class="center muted">Livro 1, Missão 14, Parte 2</p><div class="total"><span>Professor Thiago, de Matemática</span></div><p class="center">E.E. Moacyr Amaral<br>7º ano</p><div class="tip">Toque em <b>Próximo</b> para avançar. Primeiro 3 ideias rápidas, depois as 4 questões.</div>';}});
  S.push({html:function(){return '<div class="big">1</div><h2>Várias coisas iguais: multiplique</h2><p>Se você compra 3 garrafas e cada uma custa o mesmo preço, a conta é <b>quantidade × preço</b>.</p><div class="calc">3 × 2,50 = ?<br>2,50 é o mesmo que 2 + 0,50<br>3 × 2 = 6,00<br>3 × 0,50 = 1,50<br>6,00 + 1,50 = <b>7,50</b></div><p>Para conferir: 2,50 + 2,50 + 2,50 também dá 7,50.</p>';}});
  S.push({html:function(){return '<div class="big">2</div><h2>Coisas diferentes: some</h2><p>Para saber o <b>total</b>, some o preço de tudo. Alinhe a vírgula embaixo da vírgula, para somar centavo com centavo.</p><div class="calc">&nbsp;&nbsp;2,00<br>+ 1,50<br>------<br>&nbsp;&nbsp;3,50</div><p>Total da compra: <b>R$ 3,50</b>.</p>';}});
  S.push({html:function(){return '<div class="big">3</div><h2>Troco: o que você pagou menos o total</h2><p><b>Troco = valor pago − total da compra.</b></p><div class="calc">Pagou 5,00 e o total foi 3,50<br>5,00 − 3,50 = <b>1,50</b></div><div class="tip"><b>Prova do troco:</b> total + troco tem que dar o que você pagou. 3,50 + 1,50 = 5,00. Deu certo!</div>';}});
  Q.forEach(function(q,i){ S.push({q:i}); });
  S.push({final:true});

  var idx=0, card=document.getElementById("card"), prog=document.getElementById("prog");
  S.forEach(function(){var d=document.createElement("i");prog.appendChild(d);});

  function score(){var n=0;answered.forEach(function(a,i){if(a!==null&&a===Q[i].c)n++;});return n;}

  function render(){
    var s=S[idx];
    prog.querySelectorAll("i").forEach(function(d,k){d.className=k<=idx?"on":"";});
    if(s.html){card.innerHTML=s.html();}
    else if(s.final){
      var n=score(), t=answered.filter(function(a){return a!==null;}).length;
      card.innerHTML='<h2>Fim da aula</h2><div class="total"><span>RESULTADO</span><span>'+n+' de 4</span></div>'+(t<4?'<p class="muted">Você respondeu '+t+' de 4 questões. Volte para fazer as que faltam.</p>':'<p>Muito bem por chegar até aqui!</p>')+
        '<div class="stamp s2"><b>MATIFIC</b><span>O Matific equivale à <b>nota do bimestre</b>. Faça as atividades.</span></div>'+
        '<div class="stamp s1"><b>TAREFA</b><span>Deixe a tarefa <b>tudo em dia</b>. Lance as respostas na plataforma, é lá que vale nota.</span></div>'+
        '<p class="center muted">Professor Thiago, de Matemática<br>E.E. Moacyr Amaral</p>';
    } else {
      var q=Q[s.q];
      card.innerHTML='<div class="qno">QUESTÃO '+(s.q+1)+' DE 4</div><p class="stmt">'+q.t+'</p><div class="opts" id="opts"></div><div class="reveal" id="rev" aria-live="polite"></div>';
      var box=document.getElementById("opts");
      q.o.forEach(function(txt,k){
        var b=document.createElement("button"); b.type="button"; b.className="opt";
        b.innerHTML='<span class="l">'+L[k]+')</span><span></span>'; b.lastChild.textContent=txt;
        b.addEventListener("click",function(){ if(answered[s.q]===null){answered[s.q]=k;} showAnswer(s.q); });
        box.appendChild(b);
      });
      if(answered[s.q]!==null){showAnswer(s.q);}
    }
    card.scrollTop=0;
    document.getElementById("back").disabled=(idx===0);
    var nx=document.getElementById("next");
    nx.textContent=(idx===S.length-1)?"Recomeçar":(idx===0?"Começar":"Próximo");
  }

  function showAnswer(i){
    var q=Q[i], k=answered[i], ok=(k===q.c);
    var btns=document.querySelectorAll("#opts .opt");
    btns.forEach(function(x,xi){x.disabled=true; if(xi===q.c)x.classList.add("right"); if(xi===k&&!ok)x.classList.add("wrong");});
    var h='<p><b>'+(ok?"Acertou!":"Quase lá.")+'</b> Veja a conta passo a passo:</p><ol class="steps">';
    q.steps.forEach(function(st){h+='<li>'+st+'</li>';});
    h+='</ol><div class="res">'+q.res+'</div><p class="mono-s">'+q.prova+'</p><h3>Por que as outras estão erradas</h3><ul class="why">';
    q.why.forEach(function(w){h+='<li>'+w+'</li>';});
    h+='</ul><div class="tip"><b>Lembre:</b> lance a resposta na plataforma. É lá que vale nota.</div>';
    var rev=document.getElementById("rev"); rev.innerHTML=h; rev.classList.add("on");
  }

  function go(d){ var n=idx+d; if(n<0)return; if(n>=S.length){idx=0;answered=[null,null,null,null];} else {idx=n;} render(); }
  document.getElementById("next").addEventListener("click",function(){go(1);});
  document.getElementById("back").addEventListener("click",function(){go(-1);});
  document.addEventListener("keydown",function(e){
    if(document.getElementById("ov").classList.contains("on")){ if(e.key==="Escape")closeOv(); return; }
    if(e.key==="ArrowRight")go(1); if(e.key==="ArrowLeft")go(-1);
  });

  // pop-up
  var ov=document.getElementById("ov");
  function openOv(){ov.classList.add("on");document.getElementById("ok").focus();}
  function closeOv(){ov.classList.remove("on");}
  document.getElementById("ok").addEventListener("click",closeOv);
  document.getElementById("recbtn").addEventListener("click",openOv);

  render(); openOv();
})();
</script>
</body>
</html>
